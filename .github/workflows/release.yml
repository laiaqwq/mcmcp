name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Release MCMCP
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "::error::Tag version $tag_version does not match mod_version $project_version"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Generate checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256sum "build/libs/mcmcp-${version}.jar" > "build/libs/mcmcp-${version}.jar.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/mcmcp-${version}.jar" \
            "build/libs/mcmcp-${version}.jar.sha256" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits
